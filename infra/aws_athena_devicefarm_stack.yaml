AWSTemplateFormatVersion: "2010-09-09"
Description: "AegisQA Enterprise — AWS S3 Telemetry Lake, Athena Workgroup & AWS Device Farm Appium Stack"

Resources:
  AegisTelemetryLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AegisAthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: aegisqa-ai-telemetry-wg
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AegisTelemetryLakeBucket}/athena-results/"

  AegisDeviceFarmProject:
    Type: AWS::DeviceFarm::Project
    Properties:
      Name: AegisQA-Mobile-BLE-Provisioning-Suite
      DefaultJobTimeoutMinutes: 30
