name: AegisQA AI Quality Gate & IoT Automation CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  ai-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AegisQA Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AegisQA Full Quality Gate (LLM Evals, Red-Team, SQL Pipeline, Appium BLE, API Load)
        run: |
          python3 run_quality_gate.py

      - name: Upload Evaluation & Telemetry Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegisqa-eval-report
          path: reports/latest_eval_report.json
